services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Locale service - manages current and default locale
  Janwebdev\TranslatableEntityBundle\Locale\LocaleInterface:
    class: Janwebdev\TranslatableEntityBundle\Locale\Locale
    arguments:
      $defaultLocale: "%kernel.default_locale%"

  Janwebdev\TranslatableEntityBundle\Locale\Locale:
    arguments:
      $defaultLocale: "%kernel.default_locale%"

  # Event adapter for Doctrine ORM
  Janwebdev\TranslatableEntityBundle\Mapping\Event\Adapter\EventAdapterInterface:
    class: Janwebdev\TranslatableEntityBundle\Mapping\Event\Adapter\ORM\DoctrineAdapter

  Janwebdev\TranslatableEntityBundle\Mapping\Event\Adapter\ORM\DoctrineAdapter: ~

  # Locale listener - sets locale from request
  Janwebdev\TranslatableEntityBundle\Listener\LocaleListener:
    tags:
      - {
          name: kernel.event_listener,
          event: kernel.request,
          method: setLocale,
          priority: 16,
        }

  # Translatable listener - injects locale into translatable entities
  Janwebdev\TranslatableEntityBundle\Listener\TranslatableListener:
    tags:
      - { name: doctrine.event_listener, event: postLoad, lazy: true }
